events {}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 20m;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=loadtest_api_per_ip:10m rate=400r/s;
  limit_conn_zone $binary_remote_addr zone=loadtest_conn_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;
  map $http_upgrade $connection_upgrade {
    default close;
    websocket upgrade;
  }
  map $http_upgrade $websocket_upgrade {
    default '';
    websocket websocket;
  }

  server {
    listen 80;
    server_name _;
    limit_conn loadtest_conn_per_ip 100;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    location = /health/public {
      limit_req zone=loadtest_api_per_ip burst=800 nodelay;
      proxy_pass http://api-loadtest:3001;
      proxy_set_header Host api-loadtest.sgsseguranca.com.br;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      limit_req zone=loadtest_api_per_ip burst=800 nodelay;
      proxy_pass http://api-loadtest:3001;
      proxy_http_version 1.1;
      proxy_set_header Host api-loadtest.sgsseguranca.com.br;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $websocket_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
