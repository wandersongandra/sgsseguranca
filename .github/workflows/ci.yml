name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint/Test/Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # ------------------------------------------------------------------
      # A PARTIR DAQUI, CADA CHECK E INDEPENDENTE.
      #
      # O default do GitHub Actions e `if: success()`, entao o primeiro step
      # vermelho marcava TODOS os seguintes como `skipped`. Como o audit de
      # dependencias vinha antes de lint/type-check/test/build, um CVE em
      # dependencia transitiva apagava toda a evidencia do PR.
      #
      # `!cancelled()` faz cada check rodar mesmo com outro vermelho — e NAO e
      # `continue-on-error`: a falha continua reprovando o job. A diferenca e
      # entre separar execucao e esconder resultado.
      # ------------------------------------------------------------------
      - name: Security baseline gate (refresh CSRF)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NODE_ENV: staging
          REFRESH_CSRF_ENFORCED: "true"
          REFRESH_CSRF_REPORT_ONLY: "false"
        run: npm run security:phase0:baseline

      - name: Security baseline negative test (must fail on insecure CSRF)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NODE_ENV: staging
          REFRESH_CSRF_ENFORCED: "false"
          REFRESH_CSRF_REPORT_ONLY: "true"
        run: |
          set +e
          npm run security:phase0:baseline
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "Expected security:phase0:baseline to fail for insecure CSRF config, but it succeeded."
            exit 1
          fi
          echo "Negative test passed: insecure CSRF config was blocked as expected."

      - name: Audit backend dependencies (high+critical)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high

      - name: Lint backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Type-check backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run type-check

      - name: Test backend (shard 1/2)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:ci -- --shard=1/2

      - name: Test backend (shard 2/2)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:ci -- --shard=2/2

      - name: Smoke backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:smoke

      - name: Build backend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Validate migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run ci:migration:check

  backend-migration-pg17:
    name: PostgreSQL 17 Migration 0392 Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Build backend migration artifact
        run: npm run build

      - name: Run real PostgreSQL 17 migration 0392 integration
        env:
          PG17_MIGRATION_TEST_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5435/postgres
        run: npm run test:migration:0392:pg17

  backend-e2e:
    name: Backend E2E Critical Flows
    runs-on: ubuntu-latest
    # Sem `needs: backend` — de proposito.
    #
    # Este job monta o proprio PostgreSQL, cria as roles de RLS, roda as
    # migrations e instala as proprias dependencias: nao consome artefato
    # nenhum do job `backend`. A dependencia era so ordenacao, e custava caro —
    # qualquer step vermelho la (inclusive um CVE em dependencia transitiva,
    # sem relacao com o codigo do PR) fazia o E2E de seguranca ser `skipped`,
    # apagando a unica evidencia de que as guardas contra fail-open de RLS
    # funcionam contra um banco real.
    #
    # Isto NAO esconde falha: o job `backend` continua reprovando por conta
    # propria e o merge continua bloqueado.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: sst_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sst_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5433
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-postgres-password
      DATABASE_NAME: sst_test
      E2E_DATABASE_HOST: 127.0.0.1
      E2E_DATABASE_PORT: 5433
      E2E_DATABASE_USER: sgs_app
      E2E_DATABASE_PASSWORD: sgs_app_e2e
      E2E_DATABASE_NAME: sst_test
      E2E_PRESERVE_MIGRATED_SCHEMA: true
      DATABASE_MIGRATION_URL: postgresql://neondb_owner:neondb_owner_e2e@127.0.0.1:5433/sst_test
      DATABASE_ADMIN_URL: postgresql://sgs_admin:sgs_admin_e2e@127.0.0.1:5433/sst_test
      DATABASE_SSL: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      E2E_REDIS_HOST: 127.0.0.1
      E2E_REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret-for-e2e-testing-only-0123456789
      JWT_REFRESH_SECRET: test-refresh-secret-for-e2e-testing-only-0123456789
      BCRYPT_SALT_ROUNDS: 4
      THROTTLE_LIMIT: 10000
      THROTTLE_TTL: 60000
      LOGIN_THROTTLE_LIMIT: 100
      FORGOT_PASSWORD_THROTTLE_LIMIT: 100
      CHANGE_PASSWORD_THROTTLE_LIMIT: 100
      DISABLE_LOGIN_THROTTLE_IN_DEV: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only postgresql-client (from Ubuntu's own main/universe) is needed here.
      # `apt-get update` by default also refreshes every third-party repo the
      # runner image ships pre-configured under sources.list.d/ (Google Chrome,
      # Microsoft, Docker, ...), none of which this step uses — a transient
      # hash-mismatch on any of them (observed repeatedly with
      # dl.google.com/linux/chrome-stable/deb) fails this step even though
      # Ubuntu's own package index fetched fine. Restricting the update to
      # Dir::Etc::sourcelist (Ubuntu's sources.list) and skipping
      # Dir::Etc::sourceparts (sources.list.d/*) keeps hash/signature
      # verification fully intact — it only narrows *which* repos this one
      # command consults, scoped to this single invocation via -o flags (no
      # files on disk are touched, no effect on any other step).
      - name: Install PostgreSQL client
        run: |
          sudo apt-get \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0" \
            update
          sudo apt-get install -y postgresql-client

      - name: Prepare RLS roles on clean PostgreSQL
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d sst_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'neondb_owner') THEN
              CREATE ROLE neondb_owner LOGIN PASSWORD 'neondb_owner_e2e' SUPERUSER;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sgs_rls_bypass') THEN
              CREATE ROLE sgs_rls_bypass NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sgs_app') THEN
              CREATE ROLE sgs_app LOGIN PASSWORD 'sgs_app_e2e' NOSUPERUSER NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sgs_admin') THEN
              CREATE ROLE sgs_admin LOGIN PASSWORD 'sgs_admin_e2e' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          ALTER DATABASE sst_test OWNER TO neondb_owner;
          GRANT sgs_rls_bypass TO sgs_admin;
          SQL

      - name: Build and reconstruct schema from migrations
        run: |
          npm run build
          npm run migration:run

      - name: Grant privileged access after reconstruction
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d sst_test -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO sgs_admin;
          GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO sgs_admin;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sgs_admin;
          ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON TABLES TO sgs_admin;
          ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO sgs_admin;
          SQL

      - name: Assert E2E runtime uses non-privileged RLS role
        env:
          PGPASSWORD: sgs_app_e2e
        run: |
          psql -h 127.0.0.1 -p 5433 -U sgs_app -d sst_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            runtime_role RECORD;
          BEGIN
            SELECT r.rolsuper, r.rolbypassrls
              INTO runtime_role
              FROM pg_roles r
             WHERE r.rolname = current_user;
            IF current_user <> 'sgs_app' THEN
              RAISE EXCEPTION 'E2E runtime role inesperado: %', current_user;
            END IF;
            IF runtime_role.rolsuper OR runtime_role.rolbypassrls THEN
              RAISE EXCEPTION 'sgs_app possui privilegio de bypass/superuser';
            END IF;
            IF pg_has_role(current_user, 'sgs_rls_bypass', 'member') THEN
              RAISE EXCEPTION 'sgs_app ainda e membro de sgs_rls_bypass';
            END IF;
          END
          $$;
          SQL

      - name: Run critical e2e flows
        env:
          NODE_OPTIONS: --experimental-require-module
          # Armazenamento local: DocumentStorageService usa disco em vez de B2/S3
          # quando LOCAL_DOCUMENT_STORAGE_DIR está definido (bloqueado em production).
          LOCAL_DOCUMENT_STORAGE_DIR: /tmp/e2e-document-storage
        run: npm run test:e2e -- --forceExit

  backend-dr-e2e:
    name: Backend E2E DR Restore (Dedicated Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: sst_test_dr
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sst_test_dr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5434
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-postgres-password
      DATABASE_NAME: sst_test_dr
      E2E_DATABASE_HOST: 127.0.0.1
      E2E_DATABASE_PORT: 5434
      E2E_DATABASE_USER: sgs_app
      E2E_DATABASE_PASSWORD: sgs_app_e2e
      E2E_DATABASE_NAME: sst_test_dr
      E2E_PRESERVE_MIGRATED_SCHEMA: true
      DATABASE_MIGRATION_URL: postgresql://neondb_owner:neondb_owner_e2e@127.0.0.1:5434/sst_test_dr
      DATABASE_ADMIN_URL: postgresql://sgs_admin:sgs_admin_e2e@127.0.0.1:5434/sst_test_dr
      DATABASE_SSL: false
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      E2E_REDIS_HOST: 127.0.0.1
      E2E_REDIS_PORT: 6380
      JWT_SECRET: test-jwt-secret-for-e2e-testing-only-0123456789
      JWT_REFRESH_SECRET: test-refresh-secret-for-e2e-testing-only-0123456789
      BCRYPT_SALT_ROUNDS: 4
      THROTTLE_LIMIT: 10000
      THROTTLE_TTL: 60000
      LOGIN_THROTTLE_LIMIT: 100
      FORGOT_PASSWORD_THROTTLE_LIMIT: 100
      CHANGE_PASSWORD_THROTTLE_LIMIT: 100
      DISABLE_LOGIN_THROTTLE_IN_DEV: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only postgresql-client (from Ubuntu's own main/universe) is needed here.
      # `apt-get update` by default also refreshes every third-party repo the
      # runner image ships pre-configured under sources.list.d/ (Google Chrome,
      # Microsoft, Docker, ...), none of which this step uses — a transient
      # hash-mismatch on any of them (observed repeatedly with
      # dl.google.com/linux/chrome-stable/deb) fails this step even though
      # Ubuntu's own package index fetched fine. Restricting the update to
      # Dir::Etc::sourcelist (Ubuntu's sources.list) and skipping
      # Dir::Etc::sourceparts (sources.list.d/*) keeps hash/signature
      # verification fully intact — it only narrows *which* repos this one
      # command consults, scoped to this single invocation via -o flags (no
      # files on disk are touched, no effect on any other step).
      - name: Install PostgreSQL client
        run: |
          sudo apt-get \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0" \
            update
          sudo apt-get install -y postgresql-client

      - name: Prepare RLS roles on clean PostgreSQL
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -p 5434 -U postgres -d sst_test_dr -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'neondb_owner') THEN
              CREATE ROLE neondb_owner LOGIN PASSWORD 'neondb_owner_e2e' SUPERUSER;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sgs_rls_bypass') THEN
              CREATE ROLE sgs_rls_bypass NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sgs_app') THEN
              CREATE ROLE sgs_app LOGIN PASSWORD 'sgs_app_e2e' NOSUPERUSER NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sgs_admin') THEN
              CREATE ROLE sgs_admin LOGIN PASSWORD 'sgs_admin_e2e' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          ALTER DATABASE sst_test_dr OWNER TO neondb_owner;
          GRANT sgs_rls_bypass TO sgs_admin;
          SQL

      - name: Build and reconstruct schema from migrations
        run: |
          npm run build
          npm run migration:run

      - name: Grant and verify post-REVOKE database posture
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -p 5434 -U postgres -d sst_test_dr -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO sgs_admin;
          GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO sgs_admin;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sgs_admin;
          ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON TABLES TO sgs_admin;
          ALTER DEFAULT PRIVILEGES FOR ROLE neondb_owner IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO sgs_admin;

          DO $$
          BEGIN
            IF pg_has_role('sgs_app', 'sgs_rls_bypass', 'member') THEN
              RAISE EXCEPTION 'sgs_app ainda possui sgs_rls_bypass';
            END IF;
            IF NOT pg_has_role('sgs_admin', 'sgs_rls_bypass', 'member') THEN
              RAISE EXCEPTION 'sgs_admin nao possui sgs_rls_bypass';
            END IF;
            IF NOT has_table_privilege('sgs_admin', 'public.companies', 'SELECT') THEN
              RAISE EXCEPTION 'sgs_admin nao possui SELECT em companies';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM migrations
              WHERE name = 'RevokeRlsBypassFromSgsApp1709000000361'
            ) THEN
              RAISE EXCEPTION 'migration 361 ausente';
            END IF;
            IF NOT EXISTS (
              SELECT 1
              FROM pg_class
              WHERE oid = 'public.companies'::regclass
                AND relrowsecurity
                AND relforcerowsecurity
            ) THEN
              RAISE EXCEPTION 'RLS FORCE ausente em companies';
            END IF;
          END
          $$;
          SQL

      - name: Assert DR E2E runtime uses non-privileged RLS role
        env:
          PGPASSWORD: sgs_app_e2e
        run: |
          psql -h 127.0.0.1 -p 5434 -U sgs_app -d sst_test_dr -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            runtime_role RECORD;
          BEGIN
            SELECT r.rolsuper, r.rolbypassrls
              INTO runtime_role
              FROM pg_roles r
             WHERE r.rolname = current_user;
            IF current_user <> 'sgs_app' THEN
              RAISE EXCEPTION 'DR E2E runtime role inesperado: %', current_user;
            END IF;
            IF runtime_role.rolsuper OR runtime_role.rolbypassrls THEN
              RAISE EXCEPTION 'DR sgs_app possui privilegio de bypass/superuser';
            END IF;
            IF pg_has_role(current_user, 'sgs_rls_bypass', 'member') THEN
              RAISE EXCEPTION 'DR sgs_app ainda e membro de sgs_rls_bypass';
            END IF;
          END
          $$;
          SQL

      - name: Run DR restore e2e flow
        env:
          DR_E2E_EVIDENCE_PATH: temp/dr-e2e-evidence.json
        run: npm run test:e2e -- --forceExit critical/tenant-backup-restore.e2e-spec.ts

      - name: Validate restored schema, views, indexes and integrity
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          set -euo pipefail
          mkdir -p temp
          psql -h 127.0.0.1 -p 5434 -U postgres -d sst_test_dr -v ON_ERROR_STOP=1 <<'SQL' | tee temp/dr-db-structural-evidence.txt
          SELECT json_build_object(
            'migrations', (SELECT count(*) FROM migrations),
            'rls_force_tables', (
              SELECT count(*)
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relkind = 'r'
                AND c.relrowsecurity
                AND c.relforcerowsecurity
            ),
            'rls_policies', (
              SELECT count(*) FROM pg_policies WHERE schemaname = 'public'
            ),
            'indexes', (
              SELECT count(*) FROM pg_indexes WHERE schemaname = 'public'
            ),
            'views', (
              SELECT count(*) FROM pg_views WHERE schemaname = 'public'
            ),
            'materialized_views', (
              SELECT count(*) FROM pg_matviews WHERE schemaname = 'public'
            ),
            'sgs_app_bypass', pg_has_role('sgs_app', 'sgs_rls_bypass', 'member'),
            'sgs_admin_bypass', pg_has_role('sgs_admin', 'sgs_rls_bypass', 'member'),
            'orphan_aprs', (
              SELECT count(*)
              FROM aprs a
              LEFT JOIN companies c ON c.id = a.company_id
              WHERE a.company_id IS NOT NULL AND c.id IS NULL
            ),
            'cross_tenant_apr_sites', (
              SELECT count(*)
              FROM aprs a
              JOIN sites s ON s.id = a.site_id
              WHERE a.company_id IS NOT NULL
                AND s.company_id IS NOT NULL
                AND a.company_id <> s.company_id
            )
          ) AS dr_structural_evidence;

          SELECT * FROM company_dashboard_metrics LIMIT 0;
          SELECT * FROM apr_risk_rankings LIMIT 0;

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_indexes
              WHERE schemaname = 'public'
                AND indexname = 'idx_checklists_company_modelos_created'
            ) THEN
              RAISE EXCEPTION 'indice critico de checklists ausente';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM aprs a
              LEFT JOIN companies c ON c.id = a.company_id
              WHERE a.company_id IS NOT NULL AND c.id IS NULL
            ) THEN
              RAISE EXCEPTION 'APR orfa apos restore';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM aprs a
              JOIN sites s ON s.id = a.site_id
              WHERE a.company_id IS NOT NULL
                AND s.company_id IS NOT NULL
                AND a.company_id <> s.company_id
            ) THEN
              RAISE EXCEPTION 'APR cross-tenant apos restore';
            END IF;
          END
          $$;
          SQL

      - name: Upload DR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-dr-e2e-evidence
          path: |
            backend/temp/dr-e2e-evidence.json
            backend/temp/dr-db-structural-evidence.txt
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend Lint/Test/Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.test
      NEXT_PUBLIC_APP_URL: https://app.example.test
      NEXT_PUBLIC_SITE_URL: https://app.example.test
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # Mesma separacao do job de backend: o audit deixa de sequestrar a
      # evidencia de lint/test/build. Falha continua reprovando o job.
      - name: Audit frontend dependencies (high+critical)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high

      - name: Lint frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Test frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:ci

      - name: Build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
