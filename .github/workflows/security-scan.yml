name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: "0 2 * * *"

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        if: ${{ !(github.event_name == 'push' && (github.event.before == github.sha || github.event.before == '0000000000000000000000000000000000000000')) }}
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # Exclui docs/exemplos/specs com DSNs placeholder (falsos positivos do detector
          # Postgres). Gitleaks escaneia o repo inteiro como backstop.
          extra_args: --exclude-paths=.github/trufflehog-exclude.txt

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ["backend", "frontend"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.directory }}
        run: npm ci

      - name: Security baseline gate (refresh CSRF)
        if: matrix.directory == 'backend'
        working-directory: ./${{ matrix.directory }}
        env:
          NODE_ENV: staging
          REFRESH_CSRF_ENFORCED: "true"
          REFRESH_CSRF_REPORT_ONLY: "false"
        run: npm run security:phase0:baseline

      - name: Security baseline negative test (must fail on insecure CSRF)
        if: matrix.directory == 'backend'
        working-directory: ./${{ matrix.directory }}
        env:
          NODE_ENV: staging
          REFRESH_CSRF_ENFORCED: "false"
          REFRESH_CSRF_REPORT_ONLY: "true"
        run: |
          set +e
          npm run security:phase0:baseline
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "Expected security:phase0:baseline to fail for insecure CSRF config, but it succeeded."
            exit 1
          fi
          echo "Negative test passed: insecure CSRF config was blocked as expected."

      - name: Run npm audit
        working-directory: ./${{ matrix.directory }}
        run: npm audit --audit-level=high

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: auto

  code-scanning:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "typescript"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Skip CodeQL upload on pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "Code scanning upload is disabled for pull_request runs in this repository." >> $GITHUB_STEP_SUMMARY
          echo "The branch remains covered by TruffleHog, Gitleaks, Semgrep, Snyk, npm audit and CI gates." >> $GITHUB_STEP_SUMMARY

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  lockfile-integrity:
    name: Lockfile Integrity Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ["backend", "frontend"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Verify lockfile is in sync with package.json
        working-directory: ./${{ matrix.directory }}
        run: npm ci --ignore-scripts

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        directory: ["backend", "frontend"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.directory }}
        run: npm ci --ignore-scripts --omit=optional

      - name: Generate CycloneDX SBOM
        working-directory: ./${{ matrix.directory }}
        # Upstream plugins ainda limitam o peer range ao ESLint 9. O audit exige
        # ESLint 10 para consumir minimatch/brace-expansion corrigidos; o SBOM
        # continua incluindo a árvore retornada pelo npm mesmo com ELSPROBLEMS.
        run: >
          npx --yes @cyclonedx/cyclonedx-npm@6.0.0
          --ignore-npm-errors
          --output-file ../sbom-${{ matrix.directory }}.json
          --spec-version 1.5

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.directory }}
          path: sbom-${{ matrix.directory }}.json
          retention-days: 90

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          # Sem esta opcao a action monta o SARIF com todas as severidades e
          # ignora o filtro acima, fazendo findings MEDIUM/LOW derrubarem o
          # gate. A politica de bloqueio continua sendo HIGH,CRITICAL.
          limit-severities-for-sarif: true

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-fs-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 90

      - name: Skip SARIF upload on pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "SARIF upload is skipped on pull_request runs because code scanning is unavailable in this repository." >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: "trivy-results.sarif"

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs:
      [
        secret-scanning,
        dependency-audit,
        gitleaks,
        semgrep,
        code-scanning,
        docker-security,
      ]
    if: always()
    steps:
      - name: Security Scan Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Secret scanning completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency audit completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code scanning completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker security scan completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check individual job results for details." >> $GITHUB_STEP_SUMMARY
